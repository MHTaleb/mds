server:
  port: 9999
  use-forward-headers: true 
  
spring.application.name: zuul

zuul:
  host:
    socket-timeout-millis: 60000
  add-host-header: true
  add-proxy-headers: true
  ignored-services: "*"
  routes:
    api:
      path: /applications/**
      service-id: COMPONENTS
      sensitiveHeaders:
      strip-prefix: false
    uaa:
      path: /uaa/**
      service-id: uaa
      sensitiveHeaders:
      strip-prefix: false
    client:
      path: /client/**
      service-id: client
      sensitiveHeaders:
      strip-prefix: false
    facture:
      path: /facturation/**
      service-id: facturation
      sensitiveHeaders:
      strip-prefix: false
    ressource:
      path: /MDS-WEB-RESSOURCE/**
      service-id: MDS-WEB-RESSOURCE
      sensitiveHeaders:
      strip-prefix: false
eureka.client.serviceUrl.defaultZone: http://localhost:8761/eureka/

ribbon:
  ConnectTimeout: 60000
  ReadTimeout: 600000
hystrix:
    command:
        default:
            execution:
                timeout:
                    enabled: false