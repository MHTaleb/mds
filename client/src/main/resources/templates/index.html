	<div id="menu-V">
	</div>
	
	<div>
	
	<div id="header" class="header">
		<div id="button-back">
			<svg viewBox="0 0 21 16" preserveAspectRatio="xMidYMid meet" focusable="false" style="pointer-events: none; display: block; width: 100%; height: 100%;">
				<path fill="#a0a0a0" d="M0,0h21v4H0V0z"/>

				<path fill="#a0a0a0" d="M0,12h21v4H0V12z"/>
			</svg>
		</div>
		<div id="menu-H">
			<div id="apps">
				<svg viewBox="0 0 16 16" preserveAspectRatio="xMidYMid meet" focusable="false" style="pointer-events: none; display: block; width: 100%; height: 100%;">
					<path fill="#a0a0a0" d="M0,0h4v4H0V0z"/><path fill="#a0a0a0" d="M6,0h4v4H6V0z"/><path fill="#a0a0a0" d="M12,0h4v4h-4V0z"/><path fill="#a0a0a0" d="M0,6h4v4H0V6z"/><path fill="#a0a0a0" d="M6,6h4v4H6V6z"/><path fill="#a0a0a0" d="M12,6h4v4h-4V6z"/><path fill="#a0a0a0" d="M0,12h4v4H0V12z"/><path fill="#a0a0a0" d="M6,12h4v4H6V12z"/><path fill="#a0a0a0" d="M12,12h4v4h-4V12z"/>
				</svg>
			</div>
			<div id="profile-btn" th:style="'background-image: url(graphics/'+${currentUser.profilePicture}+');  background-size:     cover; background-position: center center;'">
			
			</div>
			<div id="profile-area" >
				<div style="width: 100%; height: 96px; direction: ltr; padding: 22px 0px">
					<div id="profile" th:style="'background-image: url(graphics/'+${currentUser.profilePicture}+');  background-size:     cover; background-position: center center;'">
					</div>
					<span style="font-family: calibri;" th:text="${currentUser.username}">demo</span> <br/>
					<span style="font-family: calibri;" th:text="${currentUser.nom}">nom</span>
					<span style="font-family: calibri;" th:text="${currentUser.prenom}">prenom</span>
					
				</div>
				<div style="width: 100%; height: 50px; background: #f9f9f9; border-top: 1px solid #eeeeee;">
					<form th:action="@{/logout}" method="post">
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
						<button id="logout">Déconnexion</button>
					</form>
				</div>			
			</div>
			<div  id="apps-area">
				<ul th:if="${applications}" th:remove="all-but-first" class="apps-list">
					<li th:each="application,iter :${applications}" th:class="app" th:id="${'app'+iter.index}">
						<div class="app-icon" th:style="'background-image: url(graphics/'+${application.appIcon}+');'"></div>
						<span class="app-title" th:text="${application.appName}" >factura</span>
					</li>
				</ul>
			</div>
		</div>
    </div>
