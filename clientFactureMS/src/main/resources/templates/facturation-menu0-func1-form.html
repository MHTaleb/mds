<html>
<head>
</head>
<body>

			<form style="width: 100%; height: 100%;" target="_self"  th:action="@{/client}" th:object="${addClientObject}" method="post" id="addClient">
				<input class="btn" style="margin-right: 10px; width:100px;" type="submit"></input>
				<input class="btn" style="margin-right: 10px; width:100px;" type="reset"></input>
				<a id="close-overlay" class="close-btn"></a>
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
				<input type="hidden" th:field="*{codeInterne}" name="codeInterne" />
				<input class="edit" type="text" required="" placeholder="Réference" th:field="*{codeExterne}" name="codeExterne" />
				<input class="edit" type="text" required="" placeholder="Identifiant" th:field="*{identifiant}" name="identifiant" />
				<input class="edit" type="text" placeholder="Nom" th:field="*{nom}" name="nom" />
				<input class="edit" type="text" placeholder="Prénom" th:field="*{prenom}" name="prenom"/>
				<input class="edit" type="email" required="" placeholder="Email" th:field="*{email}" name="email"/>
				<input class="edit" type="text" placeholder="Adresse" th:field="*{adress}" name="adress"/>
				<input class="edit" type="text" placeholder="Ville" th:field="*{ville}" name="ville"/>
				<input class="edit" type="tel" placeholder="Telephone Fixe" th:field="*{clientPhone}" name="clientPhone" />
				<input class="edit" type="tel" placeholder="Télephone Portable" th:field="*{telephonePortable}" name="telephonePortable" />
				<input type="radio" placeholder="Type Client" value="1" th:field="*{clientType}" th:text="'Entreprise'" name="clientType"/>
				<input type="radio" placeholder="Type Client" checked="checked" value="0" th:field="*{clientType}" th:text="'Particulier'" name="clientType"/>
				<input type="radio" placeholder="Etat Client" checked="checked" value="1" th:field="*{clientEtat}" th:text="'Active'" name="clientEtat"/>
				<input type="radio" placeholder="Etat Client" value="0" th:field="*{clientEtat}" th:text="'Gelé'" name="clientEtat"/>
			</form>

</body>
